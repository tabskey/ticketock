<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TicketTock — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF7F0; --bg-elevated:#FFFFFF; --sidebar-bg:#211D3F;
    --text-primary:#211D3F; --text-secondary:#8B87A0; --border:#ECE6D8;
    --accent:#F5A623; --accent-hover:#E0921A; --accent-text:#1A1730;
    --shadow: 0 1px 2px rgba(33,29,63,0.06), 0 12px 32px rgba(33,29,63,0.08);
    --input-bg:#F7F4ED;
  }
  [data-theme="dark"]{
    --bg:#15132A; --bg-elevated:#1E1B38; --sidebar-bg:#0F0D22;
    --text-primary:#F1EFF8; --text-secondary:#8D89AC; --border:#2C2850;
    --accent:#F5A623; --accent-hover:#FFC155; --accent-text:#1A1730;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 32px rgba(0,0,0,0.4);
    --input-bg:#252143;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text-primary);transition:background .25s,color .25s;}
  h1,h2,.brand{font-family:'Baloo 2',cursive;}
  .protonav{position:fixed;top:18px;left:24px;z-index:50;display:flex;gap:14px;font-size:13px;}
  .protonav a{color:var(--text-secondary);text-decoration:none;padding:6px 10px;border-radius:8px;}
  .protonav a:hover{background:var(--input-bg);color:var(--text-primary);}
  .theme-toggle{position:fixed;top:16px;right:24px;z-index:50;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--bg-elevated);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);}
  .theme-toggle svg{width:20px;height:20px;stroke:var(--text-primary);}
  .wrap{min-height:100vh;display:flex;}
  .panel-left{flex:1 1 46%;background:var(--sidebar-bg);color:#F1EFF8;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;}
  .brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;}
  .brand .logo-badge{width:38px;height:38px;border-radius:11px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:var(--accent-text);}
  .tagline{color:#B7B2D6;font-size:15px;margin-top:8px;max-width:280px;}
  .illustration{position:relative;flex:1;display:flex;align-items:center;justify-content:center;}
  .clock-card{width:230px;height:230px;background:linear-gradient(145deg,var(--accent),#FFC862);border-radius:32px;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 50px rgba(0,0,0,.25);position:relative;}
  .clock-face{width:130px;height:130px;border-radius:50%;background:#FFF7E8;border:6px solid #1A1730;position:relative;}
  .clock-face::before,.clock-face::after{content:'';position:absolute;background:#1A1730;border-radius:3px;}
  .clock-face::before{width:5px;height:42px;top:24px;left:62px;transform-origin:bottom;transform:rotate(25deg);}
  .clock-face::after{width:5px;height:32px;top:34px;left:62px;transform-origin:bottom;transform:rotate(110deg);}
  .deco{position:absolute;border-radius:50%;}
  .deco.d1{width:16px;height:16px;background:#FFC862;top:18%;left:12%;}
  .deco.d2{width:10px;height:10px;background:#FFC862;bottom:22%;right:10%;}
  .plant{position:absolute;left:6%;bottom:8%;width:60px;text-align:center;}
  .plant .pot{width:44px;height:36px;background:#6B4A2E;border-radius:0 0 10px 10px;margin:0 auto;}
  .plant .leaves{width:52px;height:52px;background:#4CA36B;border-radius:50% 50% 50% 0;margin:0 auto -8px;}
  .mug{position:absolute;right:8%;bottom:6%;width:34px;height:30px;background:#F1EFF8;border-radius:0 0 8px 8px;}
  .mug::after{content:'';position:absolute;right:-10px;top:6px;width:12px;height:14px;border:4px solid #F1EFF8;border-left:none;border-radius:0 8px 8px 0;}
  .bubble{position:absolute;right:2%;bottom:26%;background:#F1EFF8;color:#211D3F;padding:10px 14px;border-radius:14px 14px 14px 2px;font-size:12.5px;font-weight:700;max-width:150px;box-shadow:0 8px 20px rgba(0,0,0,.2);}
  .panel-right{flex:1 1 54%;display:flex;align-items:center;justify-content:center;padding:40px;background:var(--bg);}
  .form-card{width:100%;max-width:380px;}
  .form-card h1{font-size:30px;margin:0 0 6px;}
  .form-card p.sub{color:var(--text-secondary);margin:0 0 32px;font-size:15px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--text-secondary);}
  .input-row{position:relative;display:flex;align-items:center;background:var(--input-bg);border:1.5px solid var(--border);border-radius:12px;padding:0 14px;transition:border-color .2s;}
  .input-row:focus-within{border-color:var(--accent);}
  .input-row svg{width:18px;height:18px;stroke:var(--text-secondary);flex:none;}
  .input-row input{border:none;background:transparent;outline:none;padding:13px 10px;font-size:14.5px;color:var(--text-primary);width:100%;font-family:inherit;}
  .row-between{display:flex;align-items:center;justify-content:space-between;font-size:13px;margin:6px 0 24px;}
  .remember{display:flex;align-items:center;gap:7px;color:var(--text-secondary);}
  .row-between a{color:var(--accent-hover);text-decoration:none;font-weight:700;}
  .btn{width:100%;padding:14px;border-radius:12px;border:none;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;}
  .btn-primary{background:linear-gradient(135deg,var(--accent),#FFC862);color:var(--accent-text);box-shadow:0 10px 24px rgba(245,166,35,.35);}
  .btn-primary:hover{filter:brightness(1.04);}
  .divider{display:flex;align-items:center;gap:12px;color:var(--text-secondary);font-size:12.5px;margin:20px 0;}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
  .btn-secondary{background:var(--bg-elevated);color:var(--text-primary);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn-secondary svg{width:16px;height:16px;}
  @media(max-width:820px){.panel-left{display:none;}}
</style>
</head>
<body>
  <div class="protonav"><a href="login.html">Login</a><a href="home.html">Início</a><a href="central.html">Central</a></div>
  <button class="theme-toggle" onclick="toggleTheme()" aria-label="Alternar tema">
    <svg id="theme-icon" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
  </button>

  <div class="wrap">
    <div class="panel-left">
      <div class="brand"><span class="logo-badge">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.5 2"></path></svg>
      </span>TicketTock</div>
      <div class="tagline">Pequenos problemas, grandes soluções.</div>
      <div class="illustration">
        <div class="deco d1"></div><div class="deco d2"></div>
        <div class="clock-card"><div class="clock-face"></div></div>
        <div class="plant"><div class="leaves"></div><div class="pot"></div></div>
        <div class="mug"></div>
        <div class="bubble">Seu chamado chega mais longe aqui! 💛</div>
      </div>
      <div></div>
    </div>

    <div class="panel-right">
      <div class="form-card">
        <h1>Bem-vindo(a)!</h1>
        <p class="sub">Faça login para acessar o TicketTock.</p>
        <form onsubmit="event.preventDefault(); window.location.href='home.html';">
          <div class="field">
            <label for="user">Usuário ou e-mail</label>
            <div class="input-row">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              <input id="user" type="text" placeholder="tabatha.macedo" required>
            </div>
          </div>
          <div class="field">
            <label for="pass">Senha</label>
            <div class="input-row">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              <input id="pass" type="password" placeholder="••••••••" required>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="cursor:pointer" onclick="const p=document.getElementById('pass'); p.type = p.type==='password'?'text':'password';"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </div>
          </div>
          <div class="row-between">
            <label class="remember"><input type="checkbox"> Lembrar de mim</label>
            <a href="#">Esqueceu a senha?</a>
          </div>
          <button type="submit" class="btn btn-primary">Entrar</button>
        </form>
        <div class="divider">Ou</div>
        <button class="btn btn-secondary" onclick="window.location.href='home.html'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          Entrar com SSO
        </button>
      </div>
    </div>
  </div>

<script>
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('tickettock-theme', t);
  const icon = document.getElementById('theme-icon');
  icon.innerHTML = t === 'dark'
    ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>'
    : '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(cur);
}
(function(){
  const saved = localStorage.getItem('tickettock-theme');
  const preferred = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  applyTheme(preferred);
})();
</script>
</body>
</html>
