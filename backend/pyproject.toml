[project]
name = "ticketock-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "sqlalchemy==2.0.54",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.15.0",
    "bcrypt==5.0.0",
    "pyjwt==2.14.0",
    "email-validator==2.3.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
